<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists and image</title>
</head>

<body>

    <!--Unordered list type=disc,square,circle -->

    <ul type="disc">
        <li>Apple</li>
        <li>Orange</li>
        <li>Grapes</li>
    </ul>

    <ul type="square">
        <li>Apple</li>
        <li>Orange</li>
        <li>Grapes</li>
    </ul>

    <ul type="circle">
        <li>Apple</li>
        <li>Orange</li>
        <li>Grapes</li>
    </ul>

    <img src="htmllogo.png" alt="Logo">



    <!-- ol types= A,a,1,I,i -->
    <ol type="A">
        <li>Apple</li>
        <li>Orange</li>
        <li>Grapes</li>
    </ol>

    <!-- nested list -->
    <ol type="I">
        <li>
            Fruits
            <ul type="disc">
                <li>Apple</li>
                <li>Orange</li>
                <li>Grapes</li>
            </ul>
        </li>
        <li>
            Vegeteables
            <ul type="disc">
                <li>Carrot</li>
                <li>Potato</li>
            </ul>
        </li>
    </ol>


    <!-- description list -->
    <dl>
        <!-- dt=>Description title -->
        <dt>HTML</dt>
        <!-- dd=>description definition -->
        <dd>HyperText Markup Language</dd>

        <dt>CSS</dt>
        <dd>Cascading StyleSheet</dd>

        <dt>JS</dt>
        <dd>JavaScript</dd>
    </dl>

</body>

</html>
